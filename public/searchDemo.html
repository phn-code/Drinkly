<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Imma search</title>
  <link rel="stylesheet" href="stylesheets/search_style.css" />
</head>
<body>
  <button type="button" id="closeBtn" class="close-button">×</button>
  <button type="button" id="doneBtn" class="done-button">Done</button>

  <h1>Searching feature</h1>
  <input type="text" id="searchBox" size="50" placeholder="Enter drink name..." />
  <button type="button" id="searchBtn">Search</button>

  <div id="results"></div>

  <div id="selectionStatus" style="margin-top: 15px; font-weight: bold;">
    Selected Drinks: <span id="selectedCount">0</span>
    <ul id="selectedNames" style="margin-top: 10px; font-weight: normal;"></ul>
  </div>


  <script>
    document.addEventListener('DOMContentLoaded', () => {
      (async () => {
        try {
          const response = await fetch('http://localhost:3000/loginUser/getListDetails', {
            credentials: 'include'
          });
    
          if (response.ok) {
            const data = await response.json();
            console.log('Session List Data:', data);
    
            const header = document.createElement('h2');
            header.textContent = `Creating list: ${data.listName}`;
            document.body.insertBefore(header, document.body.firstChild);
          } else {
            console.warn('No session data found');
          }
        } catch (err) {
          console.error('Failed to fetch session data', err);
        }
      })();

      const btn = document.getElementById('searchBtn');
      const box = document.getElementById('searchBox');
      const results = document.getElementById('results');
      const closeBtn = document.getElementById('closeBtn');
      const doneBtn = document.getElementById('doneBtn');
      const selectedDrinkIds = new Set();
      const selectedCountSpan = document.getElementById('selectedCount');
      const selectedDrinkNames = new Map(); // id => name
      const selectedNamesList = document.getElementById('selectedNames');

      //testing:
      fetch('/loginUser/profile', {
        method: 'GET',
        credentials: 'include'
      })
      .then(response => response.json())
      .then(data => {
          console.log('Session userId:', data.userId); 
      })
      .catch(error => {
          console.error('Error fetching profile:', error);
      });


      function updateSelectedCountDisplay() {
        selectedCountSpan.textContent = selectedDrinkIds.size;

        selectedNamesList.innerHTML = '';
        selectedDrinkIds.forEach(id => {
          const name = selectedDrinkNames.get(id);
          if (name) {
            const li = document.createElement('li');
            li.textContent = name;
            selectedNamesList.appendChild(li);
          }
        });
      }

      closeBtn.addEventListener('click', () => {
        console.log("Navigating away (Close). Selected drinks:", Array.from(selectedDrinkIds));
        window.location.href = 'drink_page.html';
      });

      doneBtn.addEventListener('click', async () => {
        if (selectedDrinkIds.size === 0) {
          alert("No drinks have been selected.");
          return;
        }

        const selectedDrinks = Array.from(selectedDrinkIds).map(id => ({ id }));

        try {
          const response = await fetch('http://localhost:3000/lists/saveFullList', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            credentials: 'include', // Important: includes session cookies
            body: JSON.stringify({ selectedDrinks })
          });

          const data = await response.json();

          if (response.ok) {
            alert('List saved successfully!');
          } else {
            alert('Error saving list: ' + data.error);
          }
        } catch (err) {
          console.error('Network or server error:', err);
          alert('Something went wrong while saving the list.');
        }

        // Clear selections after saving
        selectedDrinkIds.clear();
        selectedDrinkNames.clear();
        updateSelectedCountDisplay();

        // Redirect or reset UI
        window.location.href = 'drink_page.html';
      });


      btn.addEventListener('click', async () => {
        const name = box.value.trim();
        if (!name) return;
        results.innerHTML = 'Searching at da mommnent...';

        const response = await fetch(`https://www.thecocktaildb.com/api/json/v1/1/search.php?s=${encodeURIComponent(name)}`);
        const data = await response.json();

        if (!data.drinks) {
          results.innerHTML = 'No drinks found.';
          return;
        }

        results.innerHTML = '';
        data.drinks.forEach(drink => {
          const drinkDiv = document.createElement('div');
          drinkDiv.classList.add('drink-item');
          drinkDiv.dataset.drinkId = drink.idDrink;

          const ingredients = [];
          for (let i = 1; i <= 15; i++) {
            const ingredient = drink[`strIngredient${i}`];
            const measurement = drink[`strMeasure${i}`];
            if (ingredient) {
              ingredients.push(`${ingredient} - ${measurement || 'to taste'}`);
            }
          }

          drinkDiv.innerHTML = `
            <h2>${drink.strDrink}</h2>
            <img src="${drink.strDrinkThumb}" alt="${drink.strDrink}" width="200">
            <p><strong>Category:</strong> ${drink.strCategory}</p>
            <p><strong>Alcohol:</strong> ${drink.strAlcoholic}</p>
            <p><strong>Glass Type:</strong> ${drink.strGlass}</p>
            <p><strong>Ingredients:</strong></p>
            <ul>
              ${ingredients.map(ing => `<li>${ing}</li>`).join('')}
            </ul>
            <p><strong>Instructions:</strong> ${drink.strInstructions}</p>
            <hr>
          `;

          drinkDiv.addEventListener('click', () => {
            const drinkId = drink.idDrink;
            const drinkName = drink.strDrink;

            if (selectedDrinkIds.has(drinkId)) {
              selectedDrinkIds.delete(drinkId);
              selectedDrinkNames.delete(drinkId);
              drinkDiv.classList.remove('selected');
            } else {
              selectedDrinkIds.add(drinkId);
              selectedDrinkNames.set(drinkId, drinkName);
              drinkDiv.classList.add('selected');
            }

            updateSelectedCountDisplay();
            console.log("Selected Drink IDs:", Array.from(selectedDrinkIds));
          });

          results.appendChild(drinkDiv);
        });
      });

      updateSelectedCountDisplay();
    });

    
  </script>

</body>
</html>
