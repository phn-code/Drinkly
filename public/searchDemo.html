<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imma search</title>
    </head>
    <body>
        <h1>Searching feature</h1>
        <input type="text" id="searchBox" size="50" placeholder="Enter drink name...">
        <button type="button" id="searchBtn">Search</button>
        <div id="results"></div>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('searchBtn');
        const box = document.getElementById('searchBox');
        const results = document.getElementById('results');

        btn.addEventListener('click', async () => {
        const name = box.value.trim();
        if (!name) return;
        results.innerHTML = 'Searching at da mommnent...';

        const response = await fetch(`https://www.thecocktaildb.com/api/json/v1/1/search.php?s=${encodeURIComponent(name)}`);
        const data = await response.json();

        if (!data.drinks) {
          results.innerHTML = 'No drinks found.';
          return;
        }

        results.innerHTML = '';
        data.drinks.forEach(drink => {
          const drinkDiv = document.createElement('div');
          drinkDiv.innerHTML = `
            <h2>${drink.strDrink}</h2>
            <img src="${drink.strDrinkThumb}" alt="${drink.strDrink}" width="200">
            <p>${drink.strInstructions}</p>
            <hr>
          `;
          results.appendChild(drinkDiv);
        });
      });
    });
        </script>
    </body>
</html>
