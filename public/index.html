<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drinkly Home Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!--icon for drinkly-->
  <link rel="stylesheet" href="/stylesheets/style.css" />
  <link rel="stylesheet" href="/stylesheets/search.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="scripts/darkmode.js" defer></script>
  <script src="scripts/index.js" defer></script>
  <script src="scripts/search.js" defer></script>
</head>

<body id="body-cont">
  <!-- Top Navigation Bar -->
  <div class="header">
    <nav class="text-center margin-from-top">
      <div class="logo">
        <i class="fa-solid fa-martini-glass fa-bounce"></i>
        <p>Drinkly</p>
      </div>
      <div class="nav-links">
        <a href="/index.html" class="nav-item" title="Home"><i class="fa-solid fa-house fa-beat fa-2x"></i></a>
        <a href="/lists.html" class="nav-item" title="Lists"><i class="fa-solid fa-list fa-2x"></i></a>
        <a href="#" class="nav-item" title="Reviews"><i class="fa-solid fa-pen-to-square fa-2x"></i></a>
        <a href="/friends.html" class="nav-item" title="Friends"><i class="fa-solid fa-users fa-2x"></i></a>
        <a href="/about.html" class="nav-item" title="About"><i class="fa-solid fa-circle-info fa-2x"></i></a>
      </div>

      <div class="nav-buttons">
        <button type="button" id="logout" class="button-primary" title="Log Out">
          <i class="fa-solid fa-door-open fa-2x"></i>
        </button>
        <button type="button" class="button-primary" onclick="toggleDarkMode()" title="Toggle Dark Mode">
          <i class="fa-solid fa-circle-half-stroke fa-spin fa-2x"></i>
        </button>
      </div>
    </nav>
  </div>

  <!-- Main Container -->
  <main class="container text-center margin-from-top main-content">
     <div class="overlay-content">
    <h1>Home</h1>
    <p id="welcome-txt">Welcome to Drinkly,</p>

    <div class="search-controls">
      <input type="text" id="searchBox" class="search-box" placeholder="Enter drink name..." />
      <button type="button" id="searchBtn" class="button-primary-search">
        <i class="fa-solid fa-magnifying-glass fa-2x"></i>
      </button>
    </div>
    <hr>

    <div id="results"></div>
     </div>

  </main>

  <div class="footer">
    <p>&copy; 2025 Drinkly</p>
  </div>
</body>

</html>
