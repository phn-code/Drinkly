<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drink Details</title>
  <link rel="stylesheet" href="/stylesheets/drinks_page.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>
<body>
  <div id="app" v-if="drink">
    <div class="card">
      <div class="card-header">
        <img :src="drink.strDrinkThumb" :alt="drink.strDrink" />
        <div class="drink-info">
          <h1>{{ drink.strDrink }}</h1>
          <p>by Drinkly</p>
          <p>⭐ 4.5 <a href="#">Add to Favourites</a></p>
        </div>
      </div>

      <!-- switch btween ingredient and instruction tabs -->
      <div class="tabs">
        <button type="button" @click="activeTab = 'ingredients'" :class="{active: activeTab === 'ingredients'}">Ingredients</button>
        <button type="button" @click="activeTab = 'preparation'" :class="{active: activeTab === 'preparation'}">Preparation</button>
      </div>

      <!-- Tab stuff -->
      <div class="tab-content">
        <ul v-if="activeTab === 'ingredients'">
          <li v-for="ingredient in ingredients" :key="ingredient">{{ ingredient }}</li>
        </ul>
        <ol v-if="activeTab === 'preparation'">
          <li>{{ drink.strInstructions }}</li>
        </ol>
      </div>

      <!-- Temporary Reviews for now since we don't hve it sorted out -->
      <button type="button" class="review-btn">Write a Review</button>
      <div class="reviews">
        <div class="review" v-for="review in reviews">
          <p><strong>{{ review.name }}</strong></p>
          <p>{{ review.comment }}</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          drink: null,
          activeTab: 'ingredients',
          reviews: [
        { name: "Alice", comment: "Tast like Ass" },
        { name: "Bob", comment: "Taste fantastic and wonderful and spectactular." }
      ]
        };
      },
      computed: {
        ingredients() {
          if (!this.drink) return [];
          const list = [];
          for (let i = 1; i <= 15; i++) {
            const item = this.drink[`strIngredient${i}`];
            if (item) list.push(item);
          }
          return list;
        }
      },
      async created() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (!id) return;

        const response = await fetch(`/drink/${id}`);
        const data = await response.json();
        this.drink = data.drink;
      }
    });

    app.mount('#app');
  </script>

</body>
</html>
