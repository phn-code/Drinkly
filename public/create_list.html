<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinkly - Add Drinks to List</title>
    <script>
    (function() {
      const darkModePref = localStorage.getItem('darkMode');
      const htmlElement = document.documentElement;

      if (darkModePref === 'true') {
        htmlElement.classList.add('dark');
      } else if (darkModePref === 'false') {
        htmlElement.classList.remove('dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        htmlElement.classList.add('dark');
          localStorage.setItem('darkMode', 'true');
      }
    })();
  </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <link rel="stylesheet" href="/stylesheets/search.css" />
    <link rel="stylesheet" href="/stylesheets/create_list.css" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/scripts/darkmode.js" defer></script>
</head>
<body id="body-cont">

  <!-- Top Navigation Bar -->
  <div class="header">
    <nav class="text-center margin-from-top">
      <div class="logo">
        <i class="fa-solid fa-martini-glass pulse-hover"></i>
        <p>Drinkly</p>
      </div>
      <div class="nav-links">
        <a href="/index.html" class="nav-item pulse-hover" title="Home">Home</a>
        <a href="/lists.html" class="nav-item pulse-hover" title="Lists">Lists</a>
        <a href="/friends.html" class="nav-item pulse-hover" title="Friends">Friends</a>
        <a href="/about.html" class="nav-item pulse-hover" title="About">About</a>
      </div>
      <div class="nav-buttons">
        <button type="button" id="logout" class="button-primary" title="Log Out">
          <i class="fa-solid fa-door-open fa-2x pulse-hover"></i>
        </button>
        <button type="button" class="button-primary" onclick="toggleDarkMode()" title="Toggle Dark Mode">
          <i class="fa-solid fa-circle-half-stroke fa-2x pulse-hover"></i>
        </button>
      </div>
    </nav>
  </div>

  <!-- Main Content -->
     <main class="container text-center margin-from-top main-content">
  <div class="create-list-page-wrapper">

    <div class="page-actions">
        <button type="button" id="closeBtn" title="Cancel and Go Back">Cancel</button>
        <div id="listTitleDisplay" class="list-title-display">Loading List Name...</div>
        <button type="button" id="doneBtn" title="Save This List">Save List</button>
    </div>

 <div class="layout-container">

        <section id="search-column" class="column left-column">
            <h1 class="page-title">Add Drinks to Your List</h1>

            <div class="search-controls">
              <div class="search-input-wrapper">
                <input type="text" id="searchBox" class="search-box" placeholder="Search for drinks to add..." />
                <button type="button" id="searchBtn" class="button-primary-search">
                  <i class="fa-solid fa-magnifying-glass fa-2x pulse-hover"></i>
                </button>
              </div>
            </div>

            <div id="results">
            </div>
        </section>

        <aside id="selection-column" class="column right-column">
            <div id="selectionStatus">
              <h3>Selected Drinks: <span id="selectedCount">0</span></h3>
              <ul id="selectedNames"></ul>
            </div>
        </aside>

    </div>
  </div>
  </main>


  <div class="footer">
    <p>© 2025 Drinkly</p>
  </div>

  <script src="/scripts/create_list.js" defer></script> 
</body>
</html>
