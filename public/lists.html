<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinkly - Your Drink Lists</title>
  <script>
    (function() {
      const darkModePref = localStorage.getItem('darkMode');
      const htmlElement = document.documentElement;

      if (darkModePref === 'true') {
        htmlElement.classList.add('dark');
      } else if (darkModePref === 'false') {
        htmlElement.classList.remove('dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        htmlElement.classList.add('dark');
          localStorage.setItem('darkMode', 'true');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!--icon for drinkly-->
  <link rel="stylesheet" href="/stylesheets/style.css" />
  <link rel="stylesheet" href="/stylesheets/search.css" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="scripts/darkmode.js" defer></script>
  <script src="scripts/index.js" defer></script>
  <script src="scripts/search.js" defer></script>
  <script src="search.js"></script>
  <link rel="stylesheet" href="stylesheets/list_page.css">

</head>

<body id="body-cont">
  <!-- Top Navigation Bar -->
  <div class="header">
    <nav class="text-center margin-from-top">
      <div class="logo">
        <i class="fa-solid fa-martini-glass pulse-hover"></i>
        <p>Drinkly</p>
      </div>
      <div class="nav-links">
        <a href="/index.html" class="nav-item pulse-hover" title="Home">Home</a>
        <a href="/lists.html" class="nav-item pulse-hover" title="Lists">Lists</a>
        <a href="/friends.html" class="nav-item pulse-hover" title="Friends">Friends</a>
        <a href="/about.html" class="nav-item pulse-hover" title="About">About</a>
      </div>

      <div class="nav-buttons">
        <button type="button" id="logout" class="button-primary" title="Log Out">
          <i class="fa-solid fa-door-open fa-2x pulse-hover"></i>
        </button>
        <button type="button" class="button-primary" onclick="toggleDarkMode()" title="Toggle Dark Mode">
          <i class="fa-solid fa-circle-half-stroke fa-2x pulse-hover"></i>
        </button>
      </div>
    </nav>
  </div>
<main class="container text-center margin-from-top main-content">
  <h1>Your Lists</h1>
    <div id="listDrinksModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close-btn">&times;</button>
        <h2 id="listDrinksTitle">Drinks in List</h2>
        <div id="drinksInList"></div>
    </div>
    </div>
    <div class="page-wrapper">
            <section class="lists-container">
                <a href="#" id="openCreateListModalBtn" class="create-new-list-button">
                    <span class="create-new-list-icon">+</span>
                    <span class="create-new-list-text">Create new list</span>
                </a>
                <div id="existingLists" class="existing-lists-grid"></div>
            </section>
    </div>

    <div id="createListModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close-btn">×</span>
            <h2>Create List</h2>
            <form id="createListForm">
                <div class="form-group">
                    <label for="listName">List name</label>
                    <input type="text" id="listName" name="listName" required>
                </div>
                <div class="form-group">
                    <label for="listDescription">Description</label>
                    <textarea id="listDescription" name="listDescription" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Choose an Icon</label>
                    <div id="defaultImageSelector" class="default-image-selector">

                        <!-- Image 1 -->
                        <img src="list_default_photos/download (1).jpeg"
                             alt="List Icon 1"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (1).jpeg">

                        <!-- Image 2 -->
                        <img src="list_default_photos/download (2).jpeg"
                             alt="List Icon 2"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (2).jpeg">

                        <!-- Image 3 -->
                        <img src="list_default_photos/download (3).jpeg"
                             alt="List Icon 3"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (3).jpeg">

                        <!-- Image 4 -->
                        <img src="list_default_photos/download (4).jpeg"
                             alt="List Icon 4"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (4).jpeg">

                        <!-- Image 5 -->
                        <img src="list_default_photos/download (5).jpeg"
                             alt="List Icon 5"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (5).jpeg">

                        <!-- Image 6 -->
                        <img src="list_default_photos/download (6).jpeg"
                             alt="List Icon 6"
                             class="default-image-option"
                             data-icon-path="list_default_photos/download (6).jpeg">
                    </div>
                    <input type="hidden" id="selectedListIcon" name="selectedListIcon" value="">
                    <p id="selectedImagePreview">No image selected.</p>
                </div>

                <!-- <div class="form-group">
                    <label for="listIconUpload" class="upload-image-label">Upload image</label>
                    <input type="file" id="listIconUpload" name="listIcon" accept="image/*">
                </div> -->

                <button type="submit" class="modal-submit-btn">Create List</button>
            </form>
        </div>
    </div>
    </main>
    <script src="./scripts/list_page.js"></script>

     <div class="footer">
    <p>&copy; 2025 Drinkly</p>
  </div>

</body>
</html>
