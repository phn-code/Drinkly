<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends</title>
       <script>
    (function() {
      const darkModePref = localStorage.getItem('darkMode');
      const htmlElement = document.documentElement;

      if (darkModePref === 'true') {
        htmlElement.classList.add('dark');
      } else if (darkModePref === 'false') {
        htmlElement.classList.remove('dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        htmlElement.classList.add('dark');
          localStorage.setItem('darkMode', 'true');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/stylesheets/style.css" />
  <link rel="stylesheet" href="/stylesheets/friends.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="scripts/darkmode.js" defer></script>
  <script src="scripts/index.js" defer></script>
  <script src="scripts/search.js" defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="scripts/friends.js" defer></script>
</head>

<body id="body-cont">
  <!-- Top Navigation Bar -->
  <div class="header">
    <nav class="text-center margin-from-top">
      <div class="logo">
        <i class="fa-solid fa-martini-glass pulse-hover"></i>
        <p>Drinkly</p>
      </div>
      <div class="nav-links">
        <a href="/index.html" class="nav-item pulse-hover" title="Home">Home</a>
        <a href="/lists.html" class="nav-item pulse-hover" title="Lists">Lists</a>
        <a href="/friends.html" class="nav-item pulse-hover" title="Friends">Friends</a>
        <a href="/about.html" class="nav-item pulse-hover" title="About">About</a>
      </div>

      <div class="nav-buttons">
        <button type="button" id="logout" class="button-primary" title="Log Out">
          <i class="fa-solid fa-door-open fa-2x pulse-hover"></i>
        </button>
        <button type="button" class="button-primary" onclick="toggleDarkMode()" title="Toggle Dark Mode">
          <i class="fa-solid fa-circle-half-stroke fa-2x pulse-hover"></i>
        </button>
      </div>
    </nav>
  </div>

 <main class="container text-center margin-from-top main-content">
    <div class="page-wrapper">
        <h1>Friends</h1>
        <section class="friends-page-container">
            <div id="main-cont">
                <div id="friends-cont">
                  <section class="friends-grid">
                      <article class="friend-card" v-for="user in friends" :key="user.id">
                        <img
                            :src="user.p_image
                            ? `data:image/png;base64,${user.p_image}`
                            : '/list_default_photos/profile_placeholder.png'"
                            :alt="`${user.name} profile picture`"
                            class="profile-avatar card-avatar">

                        <h3 class="username">{{user.name}}</h3>
                        <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                          {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                        </button>
                      </article>
                  </section>
                </div>

                <aside id="follow-cont">
                    <h2>Find People</h2>
                    <input type="text" placeholder="Search users…" class="search-box" v-model="searchVal">
                    <div class="filter-row">
                        <button type="button" class="filter-pill" :class="{ active: activeTab === 'all' }" @click="activeTab = 'all'">All</button>
                        <button type="button" class="filter-pill" :class="{ active: activeTab === 'popular' }" @click="activeTab = 'popular'">Popular</button>
                    </div>
                    <ul class="suggested-users">
                        <li class="suggested-user" :key="user.id" v-for="user in displayedPeople">

                          <img :src="user.p_image
                                ? `data:image/png;base64,${user.p_image}`
                                : '/list_default_photos/profile_placeholder.png'"
                               :alt="user.name + ' profile picture'"
                               class="profile-avatar list-avatar">
                          <span>{{user.name}}</span>
                          <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                            {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                          </button>
                        </li>
                    </ul>
                </aside>
            </div>
        </section>

    </div>
    </main>

 <div class="footer">
    <p>&copy; 2025 Drinkly</p>
  </div>


</body>
</html>
