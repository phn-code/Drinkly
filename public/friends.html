<!DOCTYPE html>
<html lang="en">
<head>
    <title>Friends</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="scripts/friends.js" defer></script>

</head>

<body id="body-cont">
    <h1>DRINKLY</h1>
    <p id="welcome-txt">Friends</p>
    <p>{{test}}</p>


    <div id="main-cont">
        <div id="friends-cont">
            <section class="friends-grid">
                <article class="friend-card" v-for="user in friends">
                  <h3 class="username">{{user.name}}</h3>
                  <!-- <button type="button" class="btn-unfollow">Unfollow</button> -->
                  <!-- <span>{{user.name}}</span> -->
                  <button type="button" class="" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                    {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                  </button>
                </article>

                <!-- <article class="friend-card">
                  <h3 class="username">Sarah S.</h3>
                  <button type="button" class="btn-unfollow">Unfollow</button>
                </article> -->

              </section>
        </div>
        <div id="follow-cont">

                <h2>Find People</h2>
                <div style="display: flex; flex-direction: row;">
                  <input type="text" placeholder="Search users…" class="search-box" v-model="searchVal">
                  <button type="button" class="btn-unfollow" @click="searchUsers">Search</button>
                </div>


                <!-- <div class="filter-row">
                    <button type="button" class="filter-pill active">All</button>

                  </div> -->

                  <div class="filter-row">
                    <button type="button" class="filter-pill" :class="{ active: activeTab === 'all' }" @click="activeTab = 'all'">All</button>
                    <button type="button" class="filter-pill" :class="{ active: activeTab === 'popular' }" @click="activeTab = 'popular'">Popular</button>
                  </div>


                  <ul class="suggested-users">
                    <li class="suggested-user" :key="user.id" v-for="user in suggestedPeople">
                      <span>{{user.name}}</span>
                      <button type="button" class="" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                        {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                      </button>
                    </li>

                  </ul>

        </div>


    </div>

    <!-- <button type="button" onclick="location.href='/login'">Log in</button> -->




    <!-- <button type="button" id="friends" onclick="location.href='/friends'">Log out</button> -->


</body>
</html>
