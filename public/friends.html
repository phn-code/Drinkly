<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends</title>
    <link rel="stylesheet" href="/stylesheets/friends.css">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="scripts/friends.js" defer></script>
</head>
<body id="body-cont">

    <div class="page-wrapper">
        <header>
            <nav class="main-nav">
                <ul>
                    <!-- <li><a href="#">Recipes</a></li> -->
                    <li><a href="./index.html">Main Page</a></li>
                    <li><a href="#">Members</a></li>
                    <li><a href="./drink_page.html">Lists</a></li>
                    <!-- <li><a href="#">Log In</a></li> -->
                </ul>
            </nav>
        </header>

        <main>
        <section class="friends-page-container">
            <h1>Friends</h1>


            <div id="main-cont">
                <div id="friends-cont">
                  <!-- <h2>Your Friends</h2> -->
                  <section class="friends-grid">
                      <article class="friend-card" v-for="user in friends" :key="user.id">
                        <h3 class="username">{{user.name}}</h3>
                        <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                          {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                        </button>
                      </article>
                  </section>
                </div>

                <aside id="follow-cont">
                    <h2>Find People</h2>
                    <input type="text" placeholder="Search users…" class="search-box" v-model="searchVal">
                    <div class="filter-row">
                        <button type="button" class="filter-pill" :class="{ active: activeTab === 'all' }" @click="activeTab = 'all'">All</button>
                        <button type="button" class="filter-pill" :class="{ active: activeTab === 'popular' }" @click="activeTab = 'popular'">Popular</button>
                    </div>
                    <ul class="suggested-users">
                        <li class="suggested-user" :key="user.id" v-for="user in suggestedPeople">

                          <span>{{user.name}}</span>
                          <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing" :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
                            {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
                          </button>
                        </li>
                    </ul>
                </aside>
            </div>
        </section>
    </main>

    </div>



</body>
</html>
