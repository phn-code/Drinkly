<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friends - Drinkly</title>
  <script>
    (function() {
      const darkModePref = localStorage.getItem('darkMode');
      const htmlElement = document.documentElement;

      if (darkModePref === 'true') {
        htmlElement.classList.add('dark');
      } else if (darkModePref === 'false') {
        htmlElement.classList.remove('dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        htmlElement.classList.add('dark');
          localStorage.setItem('darkMode', 'true');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /> <!--icon for drinkly-->
  <link rel="stylesheet" href="/stylesheets/style.css" />
  <link rel="stylesheet" href="/stylesheets/friends.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="scripts/darkmode.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="scripts/friends.js" defer></script>
  <script src="scripts/index.js" defer></script>
</head>

<body id="body-cont">
   <!-- Top Navigation Bar -->
  <div class="header">
    <nav class="text-center margin-from-top">
      <div class="logo">
        <i class="fa-solid fa-martini-glass pulse-hover"></i>
        <p>Drinkly</p>
      </div>
      <div class="nav-links">
        <a href="/index.html" class="nav-item pulse-hover" title="Home">Home</a>
        <a href="/lists.html" class="nav-item pulse-hover" title="Lists">Lists</a>
        <a href="#" class="nav-item pulse-hover" title="Reviews">Reviews</a>
        <a href="/friends.html" class="nav-item pulse-hover" title="Friends">Friends</a>
        <a href="/about.html" class="nav-item pulse-hover" title="About">About</a>
      </div>

      <div class="nav-buttons">
        <button type="button" id="logout" class="button-primary" title="Log Out">
          <i class="fa-solid fa-door-open fa-2x pulse-hover"></i>
        </button>
        <button type="button" class="button-primary" onclick="toggleDarkMode()" title="Toggle Dark Mode">
          <i class="fa-solid fa-circle-half-stroke fa-2x pulse-hover"></i>
        </button>
      </div>
    </nav>
  </div>
  <!-- Main Container -->
  <main class="container margin-from-top main-content">
     <div class="overlay-content">
    <h1 class="centered">Friends</h1>

    <div id="main-cont" class="flex-row">
      <!-- Friends List -->
      <section id="friends-cont" class="friends-grid">

        <!-- Show message when no friends -->
        <p v-if="friends.length === 0" class="no-friends-message">It's kinda lonely here...</p>

        <article class="friend-card" v-for="user in friends" :key="user.id">
          <h3 class="username">{{ user.name }}</h3>
          <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing"
            :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
            {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
          </button>
        </article>
      </section>

      <!-- Find People / Follow -->
      <aside id="follow-cont">
        <h2>Find People</h2>

        <input type="text" placeholder="Search users…" class="search-box" v-model="searchVal"
          aria-label="Search users" />

        <div class="filter-row">
          <button type="button" class="filter-pill" :class="{ active: activeTab === 'all' }" @click="activeTab = 'all'">
            All
          </button>
          <button type="button" class="filter-pill" :class="{ active: activeTab === 'popular' }"
            @click="activeTab = 'popular'">
            Popular
          </button>
        </div>

        <ul class="suggested-users">
          <li class="suggested-user" v-for="user in suggestedPeople" :key="user.id">
            <span>{{ user.name }}</span>
            <button type="button" @click="toggleFriend(user.id, user.isFriend)" :disabled="user.isProcessing"
              :class="{ 'btn-rm': user.isFriend, 'btn-unfollow': !user.isFriend }">
              {{ user.isProcessing ? 'Processing...' : (user.isFriend ? 'Remove Friend' : 'Add Friend') }}
            </button>
          </li>
        </ul>
      </aside>
    </div>
     </div>
  </main>

  <div class="footer">
    <p>&copy; 2025 Drinkly</p>
  </div>


</body>

</html>
